services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mdm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdm}
      POSTGRES_DB: mdm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdm -d mdm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment: &backend-env
      MDM_DATABASE_URL: postgresql+psycopg://mdm:${POSTGRES_PASSWORD:-mdm}@postgres:5432/mdm
      MDM_REDIS_URL: redis://redis:6379/0
      MDM_JWT_SECRET: ${MDM_JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
      MDM_ADMIN_EMAIL: ${MDM_ADMIN_EMAIL:-admin@example.com}
      MDM_ADMIN_PASSWORD: ${MDM_ADMIN_PASSWORD:-admin123}
      MDM_DEMO_SEED: ${MDM_DEMO_SEED:-true}
      MDM_SECRET_KEY: ${MDM_SECRET_KEY:-dev-only-secret-key-change-me}  # encrypts stored connection passwords
      MDM_INGEST_BUS: kafka
      MDM_KAFKA_BOOTSTRAP: kafka:9092
      MDM_IMPORT_DIR: /data/imports
    volumes:
      - imports:/data/imports
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *backend-env
    volumes:
      - imports:/data/imports
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  # Kafka backbone (single-node KRaft, development sizing). Topics are auto-created on first publish.
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # normalizer + ingest-writer: consumes mdm.raw.* and mdm.source.normalized, writes to PostgreSQL.
  # Exits on infrastructure errors; `restart` resumes from the last committed offset.
  consumers:
    build: ./backend
    command: ["python", "-m", "app.consumers"]
    environment: *backend-env
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      api: { condition: service_started }

  ui:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

  mcp:
    build: ./mcp
    environment:
      MDM_API_URL: http://api:8000
      # Create a bot in the UI/API (POST /api/v1/bots), put its token in .env, then `docker compose up -d mcp`
      MDM_API_TOKEN: ${MDM_MCP_TOKEN:-}
      MCP_PORT: "8001"
    depends_on:
      - api
    ports:
      - "8001:8001"

volumes:
  pgdata:
  kafkadata:
  imports:
