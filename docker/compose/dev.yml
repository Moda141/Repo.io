services:
  postgres:
    image: postgres:15
    environment: {POSTGRES_USER: repoio, POSTGRES_PASSWORD: repoio, POSTGRES_DB: repoio}
    ports: ["5432:5432"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment: {discovery.type: single-node, xpack.security.enabled: "false"}
    ports: ["9200:9200"]
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment: {KAFKA_PROCESS_ROLES: broker, KAFKA_NODE_ID: 1}
    ports: ["9092:9092"]
