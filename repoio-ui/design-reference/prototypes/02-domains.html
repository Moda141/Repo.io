<title>Repo.io Domains</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: SAP Fiori Horizon (light, Compact). List Report for Domains, Object Pages with breadcrumb for each drill-down level, tabbed Object Page for a table. */
:root{
  color-scheme:light;
  --page:#F5F6F7; --card:#FFFFFF; --line:#E5E5E5; --line2:#D9D9D9; --pop-bd:#A8B3BD;
  --fg:#131E29; --fg2:#556B82; --fg3:#8396A8; --icon:#758CA4;
  --brand:#0064D9; --brand-strong:#0070F2; --hover:#EAECEE; --active:#DEE2E5; --sel:#EBF8FF; --focus:#0032A5;
  --pos:#256F3A; --pos-el:#30914C; --pos-bg:#F5FAE5;
  --crit:#B44F00; --crit-el:#E76500; --crit-bg:#FFF8D6;
  --neg:#AA0808; --neg-el:#F53232; --neg-bg:#FFEAF4;
  --info:#0064D9; --info-el:#0070F2; --info-bg:#E8F3FF;
  --neutral:#556B82; --neutral-el:#788FA6; --neutral-bg:#EFF1F2;
  --group:#EFF1F2; --field-bd:#556B81;
  --shadow:0 0 .125rem 0 rgba(34,53,72,.15),0 .125rem .5rem 0 rgba(34,53,72,.15);
  --font:"IBM Plex Sans Arabic","72","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#fff}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums}

/* Shell bar */
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#fff;height:52px;display:flex;align-items:center;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.ibtn{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn:hover{background:var(--hover)}
.logo{display:flex;align-items:center;padding:4px;border-radius:8px;flex:none}
.logo img{height:32px;width:auto;display:block}
.sep{width:1px;height:24px;background:var(--line);margin-inline:8px}
.app-title{font-weight:700;font-size:15px;white-space:nowrap}
.grow{flex:1}
.search{display:flex;align-items:center;gap:8px;width:min(400px,32vw);height:36px;padding-inline:14px 10px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px var(--pop-bd);color:var(--fg2)}
.search input{flex:1;border:0;background:transparent;font-size:14px;color:var(--fg);min-width:0;outline:none}
.search input::placeholder{color:var(--fg3);font-style:italic}
.avatar{width:32px;height:32px;border-radius:50%;background:#7858FF;color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;margin-inline-start:4px}

/* Page header (List Report / Object Page) */
.ph{background:#fff;border-bottom:1px solid var(--line);position:relative}
.ph-in{max-width:1440px;margin-inline:auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;color:var(--fg);min-height:20px}
.crumbs button{border:0;background:none;padding:0;color:var(--brand);font:inherit;cursor:pointer}
.crumbs button:hover{text-decoration:underline}
.crumbs .slash{color:var(--fg2)}
.oh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:6px;flex-wrap:wrap}
.oh-title{font-size:20px;font-weight:700;margin:0;text-wrap:balance}
.oh-sub{font-size:13px;color:var(--fg2);margin-top:2px}
.oh-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.oh-body{display:flex;gap:16px 32px;align-items:flex-start;flex-wrap:wrap;margin-top:14px;padding-bottom:18px}
.oh-img{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.oh-attrs{display:grid;grid-template-columns:auto auto;gap:3px 10px;font-size:13px;align-content:start}
.oh-attrs dt{color:var(--fg2);margin:0}
.oh-attrs dd{margin:0}
.facet .fl{font-size:13px;color:var(--fg2)}
.facet .fv{font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.handle{position:absolute;bottom:-13px;inset-inline-start:50%;transform:translateX(50%);display:flex;gap:6px;z-index:2}
.handle button{width:28px;height:24px;border-radius:8px;background:#fff;border:1px solid var(--pop-bd);color:var(--brand);display:grid;place-items:center;cursor:pointer}
.ph.collapsed .oh-body,.ph.collapsed .fbar{display:none}
.ph.collapsed .handle svg.ch{transform:rotate(180deg)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:-4px}
.tab{border:0;background:none;height:44px;padding-inline:12px;font:inherit;font-weight:600;color:var(--fg);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab:hover{color:var(--brand)}
.variant{display:inline-flex;align-items:center;gap:6px;font-size:20px;font-weight:700;color:var(--brand);border:0;background:none;padding:0;cursor:pointer}
.vsub{font-size:13px;color:var(--fg2);margin-top:4px}
.fbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 16px;align-items:end;margin-top:12px;padding-bottom:18px}
.ff{display:flex;flex-direction:column;gap:4px;min-width:0}
.ff label{font-size:13px;color:var(--fg2)}
.ff input,.ff select{height:26px;border:1px solid var(--field-bd);border-radius:4px;background:#fff;color:var(--fg);font-size:13px;padding-inline:8px;min-width:0}
.ff input::placeholder{color:var(--fg2);font-style:italic}
.fbar-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;grid-column:-2/-1}

/* Buttons */
.b{height:26px;padding-inline:8px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.b-emph{border:0;background:var(--brand-strong);color:#fff;font-weight:600}
.b-emph:hover{background:var(--brand)}
.b-std{border:1px solid #BCC3CA;background:#fff;color:var(--brand)}
.b-std:hover{background:var(--hover)}
.b-trans{border:0;background:none;color:var(--brand);font-weight:600}
.b-trans:hover{background:var(--hover)}

/* Content */
main{max-width:1440px;margin-inline:auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.section{background:#fff;border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;flex-wrap:wrap}
.sec-title{font-size:16px;font-weight:700;margin:0}
.sec-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tsearch{display:flex;align-items:center;gap:6px;height:26px;border:1px solid var(--field-bd);border-radius:4px;padding-inline:8px;background:#fff;min-width:0;width:240px;max-width:100%}
.tsearch input{border:0;outline:0;font-size:13px;flex:1;min-width:0;background:none;color:var(--fg)}
.tsearch input::placeholder{color:var(--fg2);font-style:italic}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:start;font-weight:600;padding:0 12px;height:32px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
td{padding:0 12px;height:32px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th.end,td.end{text-align:end}
tbody tr.nav{cursor:pointer}
tbody tr.nav:hover{background:var(--hover)}
tbody tr.nav:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
td.go{width:28px;color:var(--icon)}
td.go svg{transform:scaleX(-1)}
tr.grp td{background:var(--group);font-weight:700;border-bottom:1px solid #A8B3BD;cursor:pointer}
tr.grp td .gchev{display:inline-block;transition:transform .15s;margin-inline-end:6px;color:var(--fg)}
tr.grp[aria-expanded="false"] .gchev{transform:rotate(90deg)}
.cell-name{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ttl{font-weight:600}
.sub{color:var(--fg2);font-size:12px}
.null{color:var(--neg);font-style:italic}
.empty{padding:24px 16px;text-align:center;color:var(--fg2)}

/* Status */
.st{display:inline-flex;align-items:center;gap:4px;font-size:13px}
.st.pos{color:var(--pos)} .st.crit{color:var(--crit)} .st.neg{color:var(--neg)} .st.info{color:var(--info)} .st.neutral{color:var(--neutral)}
.st.pos svg{color:var(--pos-el)} .st.crit svg{color:var(--crit-el)} .st.neg svg{color:var(--neg-el)} .st.info svg{color:var(--info-el)}
.score{display:inline-flex;align-items:center;gap:8px;min-width:120px}
.score .trk{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;box-shadow:inset 0 0 0 1px #A8B3BD;min-width:48px}
.score .fil{display:block;height:100%}
.chip{display:inline-flex;align-items:center;height:22px;padding-inline:8px;border-radius:11px;background:var(--neutral-bg);font-size:12px;color:var(--fg)}
.gtag{display:inline-flex;align-items:center;gap:6px;height:24px;padding-inline:0 8px;border-radius:8px;font-size:12px;overflow:hidden}
.gtag::before{content:"";width:6px;align-self:stretch}
.gtag.info{background:#E1F4FF}.gtag.info::before{background:var(--info-el)}
.gtag.neutral{background:var(--neutral-bg)}.gtag.neutral::before{background:var(--neutral-el)}

/* Table object page — tab panels */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:8px 16px;padding:4px 16px 16px;font-size:13px}
.kv dt{color:var(--fg2);margin:0} .kv dd{margin:0}
.prose{padding:0 16px 16px;line-height:1.7;max-width:75ch;margin:0}
.dq-top{display:flex;gap:24px;align-items:center;padding:4px 16px 16px;flex-wrap:wrap}
.dq-score{font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.dq-dims{display:grid;gap:10px;flex:1;min-width:260px}
.dim{display:grid;grid-template-columns:140px 1fr 56px 52px;gap:10px;align-items:center;font-size:13px}
.dim .w{color:var(--fg2);font-size:12px;text-align:end}
.strip{display:flex;gap:8px;align-items:flex-start;margin:0 16px 16px;padding:8px 12px;border-radius:8px;font-size:13px;border:1px solid}
.strip.warn{background:var(--crit-bg);border-color:#FFC847}
.strip.info{background:var(--info-bg);border-color:#89D1FF}

/* Lineage (network-graph.svg — column layout) */
.lin{padding:8px 16px 20px;overflow-x:auto}
.lin-cols{display:grid;grid-auto-flow:column;grid-auto-columns:200px;gap:48px;position:relative;min-width:max-content;padding:8px 4px}
.lin-col{display:flex;flex-direction:column;gap:16px;justify-content:center}
.lin-h{font-size:12px;color:var(--fg2);text-align:center;margin-bottom:-6px}
.node{border:1px solid #A8B3BD;border-radius:8px;background:#fff;font-size:12px;position:relative;z-index:1}
.node .nh{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.node .nh svg{color:var(--icon);flex:none}
.node .nb{padding:6px 8px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;color:var(--fg2)}
.node .nb b{color:var(--fg);font-weight:500;text-align:end}
.node.current{border:2px solid var(--brand-strong)}
.node.pos{border-color:var(--pos-el)} .node.crit{border-color:var(--crit-el)}
.lin svg.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}

@media (max-width:900px){.search{display:none}.grid2{grid-template-columns:1fr}.fbar-actions{grid-column:1/-1}}
@media (max-width:560px){.hide-s{display:none}.dim{grid-template-columns:100px 1fr 48px}.dim .w{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function crumbs(){
  const parts=[{l:'الدومينات',p:[]}];

    if(x.k==='repo')parts.push({l:D.repos[x.id].name,p});
    if(x.k==='source')parts.push({l:D.sources[x.id].name,p});
    if(x.k==='table')parts.push({l:x.schema+' / '+findTable(path[2].id,x.schema,x.id).name,p});});
  return `<nav class="crumbs" aria-label="مسار التنقل">${parts.map((c,i)=>i<parts.length-1?`<button data-crumb="${i}">${esc(c.l)}</button><span class="slash">/</span>`:`<span aria-current="page">${esc(c.l)}</span>`).join('')}</nav>`;
}

const closedSchemas=new Set(); let srcQ='';
function viewSource(id){
  const S=D.sources[id];const sch=Object.keys(S.schemas);const tbl=sch.reduce((a,k)=>a+S.schemas[k].length,0);
  const q=srcQ.trim().toLowerCase();
  let body='',shown=0;
  sch.forEach(k=>{const list=S.schemas[k].filter(t=>!q||t.name.toLowerCase().includes(q)||k.includes(q));if(!list.length)return;shown+=list.length;
    const open=!closedSchemas.has(k)||q;
    body+=`<tr class="grp" tabindex="0" data-schema="${k}" aria-expanded="${!!open}"><td colspan="7"><span class="gchev">⌄</span>${svg('folder',14)} Schema: ${esc(k)} <span class="sub">(${list.length})</span></td></tr>`;
    if(open)body+=list.map(t=>`<tr class="nav" tabindex="0" data-go="table:${k}:${t.id}"><td style="padding-inline-start:36px"><span class="cell-name">${svg('table',14)}<span class="ttl">${esc(t.name)}</span></span></td><td class="end">${fmt(t.rows)}</td><td class="end">${t.cols}</td><td>${score(t.q)}</td><td class="num">${ltr(t.prof)}</td><td class="go">${GO}</td></tr>`).join('');});
  return `<section class="ph ${headerCollapsed?'collapsed':''}"><div class="ph-in">${crumbs()}
    <div class="oh-top"><div><h1 class="oh-title" tabindex="-1">${esc(S.name)}</h1><div class="oh-sub">مصدر بيانات · ${esc(S.type)}</div></div>
      <div class="oh-actions"><button class="b b-emph">مزامنة الآن</button><button class="b b-std">تعديل الاتصال</button><button class="b b-std">تشغيل الفحص</button></div></div>
    <div class="oh-body"><div class="oh-img" style="background:#1D2D3E">${svg('db',28)}</div>
      <dl class="oh-attrs"><dt>الموصّل:</dt><dd>${esc(S.type)}</dd><dt>العنوان:</dt><dd>${esc(S.host)}</dd></dl>
      <div class="facet"><div class="fl">الحالة</div><div class="fv">${st(S.state,S.stateL)}</div></div>
      <div class="facet"><div class="fl">آخر مزامنة</div><div class="fv" style="font-size:16px">${ltr(S.sync)}</div></div>
      <div class="facet"><div class="fl">Schemas</div><div class="fv">${sch.length}</div></div>
      <div class="facet"><div class="fl">Tables</div><div class="fv">${tbl}</div></div>
    </div></div>${handle()}</section>
  <main><div class="section"><div class="sec-h"><h2 class="sec-title">Schemas و Tables <span class="sub num">(${shown})</span></h2>
      <div class="sec-tools"><label class="tsearch"><input id="srcq" value="${esc(srcQ)}" placeholder="بحث عن جدول" aria-label="بحث عن جدول">${'<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'}</label>
      <button class="b b-trans" data-act="expandAll">توسيع الكل</button><button class="b b-trans" data-act="collapseAll">طي الكل</button></div></div>
    <div class="twrap"><table><thead><tr><th>الاسم</th><th class="end">الصفوف</th><th class="end">الأعمدة</th><th>الجودة</th><th>آخر فحص</th><th aria-hidden="true"></th></tr></thead><tbody>
    ${body||`<tr><td colspan="7" class="empty">لا توجد جداول مطابقة لـ "${esc(srcQ)}"</td></tr>`}</tbody></table></div></div></main>`;
}

/* ───────────── Level 4: Table (Object Page with tabs) ───────────── */
function viewTable(src,schema,id){
  const T=findTable(src,schema,id),S=D.sources[src],X=D.table;
  const tabs=[['sample','البيانات النموذجية'],['dq','مراجعة جودة البيانات'],['desc','الوصف'],['lineage','الـ Lineage']];
  return `<section class="ph ${headerCollapsed?'collapsed':''}"><div class="ph-in">${crumbs()}
    <div class="oh-top"><div><h1 class="oh-title" tabindex="-1">${esc(T.name)}</h1><div class="oh-sub">جدول · ${esc(S.name)} / ${esc(schema)}</div></div>
      <div class="oh-actions"><button class="b b-emph">تعديل الوصف</button><button class="b b-std">تشغيل فحص الجودة</button><button class="b b-std">طلب تعديل</button></div></div>
    <div class="oh-body"><div class="oh-img" style="background:#0070F2">${svg('table',28)}</div>
      <dl class="oh-attrs"><dt>المالك:</dt><dd>${esc(X.owner)}</dd><dt>أمين البيانات:</dt><dd>${esc(X.steward)}</dd><dt>الوسوم:</dt><dd>${X.tags.map(t=>`<span class="chip">${t}</span>`).join(' ')}</dd></dl>
      <div class="facet"><div class="fl">الصفوف</div><div class="fv">${fmt(T.rows)}</div></div>
      <div class="facet"><div class="fl">الأعمدة</div><div class="fv">${T.cols}</div></div>
      <div class="facet"><div class="fl">درجة الجودة</div><div class="fv st ${qState(T.q)}" style="font-size:20px">${T.q.toFixed(1)}%</div></div>
      <div class="facet"><div class="fl">آخر فحص</div><div class="fv" style="font-size:16px">${ltr(T.prof)}</div></div>
    </div>
    <div class="tabs" role="tablist" aria-label="أقسام الجدول">${tabs.map(([k,l])=>`<button class="tab" role="tab" id="tab-${k}" aria-controls="panel" aria-selected="${tab===k}" tabindex="${tab===k?0:-1}" data-tab="${k}">${l}</button>`).join('')}</div>
    </div>${handle()}</section>
  <main id="panel" role="tabpanel" aria-labelledby="tab-${tab}">${({sample:tabSample,dq:tabDQ,desc:tabDesc,lineage:tabLineage})[tab](T)}</main>`;
}
function tabSample(){const X=D.table;
  return `<div class="strip info">${ICON.info.replace('<svg','<svg style="color:var(--info-el);flex:none;margin-top:2px"')}<span>عينة من 8 صفوف من آخر فحص. الحقول الفارغة معلّمة بـ <span class="null">فارغ</span>. البيانات توضيحية.</span></div>
  <div class="section"><div class="sec-h"><h2 class="sec-title">البيانات النموذجية</h2><div class="sec-tools"><button class="b b-trans">تصدير</button></div></div>
  <div class="twrap"><table><thead><tr>${X.columns.map(c=>`<th>${c[0]}<br><span class="sub" style="font-weight:400">${c[1]}</span></th>`).join('')}</tr></thead><tbody>
  ${X.sample.map(r=>`<tr>${r.map(v=>`<td>${v==null?'<span class="null">فارغ</span>':`<bdi${/^[+\d]/.test(v)?' dir="ltr"':''}>${esc(v)}</bdi>`}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;}
function tabDQ(T){const X=D.table.dq;
  const total=X.dims.reduce((a,d)=>a+d[2]*d[3],0)/100;
  return `<div class="grid2"><div class="section"><div class="sec-h"><h2 class="sec-title">درجة الجودة</h2><span class="sub">النموذج المعتمد: دقة 30% · اكتمال 25% · صلاحية 20% · حداثة 15% · تفرد 10%</span></div>
    <div class="dq-top"><div><div class="dq-score st ${qState(total)}" style="font-size:40px">${total.toFixed(1)}%</div><div class="sub" style="margin-top:6px">آخر فحص ${ltr(T.prof)}</div></div>
    <div class="dq-dims">${X.dims.map(([l,k,w,v])=>{const s=qState(v);return `<div class="dim"><span>${l}</span><span class="score" style="min-width:0"><span class="trk"><span class="fil" style="width:${v}%;background:${QCOL[s]}"></span></span></span><span class="st ${s} num">${v.toFixed(1)}%</span><span class="w">وزن ${w}%</span></div>`;}).join('')}</div></div></div>
  <div class="section"><div class="sec-h"><h2 class="sec-title">اكتمال الأعمدة</h2><span class="sub">نسبة القيم الفارغة</span></div>
    <div class="twrap"><table><thead><tr><th>العمود</th><th>إلزامي</th><th>الفارغ</th></tr></thead><tbody>
    ${D.table.columns.map(c=>{const s=c[4]>20?'neg':c[4]>5?'crit':'pos';return `<tr><td>${c[0]}</td><td>${c[3]?'نعم':'لا'}</td><td>${st(s,c[4].toFixed(1)+'%')}</td></tr>`;}).join('')}</tbody></table></div></div></div>
  <div class="strip warn">${ICON.crit.replace('<svg','<svg style="color:var(--crit-el);flex:none;margin-top:2px"')}<span>4,821 سجلاً مرشحاً للدمج. افتح <a href="#" onclick="return false">مرشحو الدمج</a> لمراجعتها.</span></div>
  <div class="section"><div class="sec-h"><h2 class="sec-title">اختبارات الجودة <span class="sub num">(${X.tests.length})</span></h2></div>
    <div class="twrap"><table><thead><tr><th>القاعدة</th><th>العمود</th><th>النتيجة</th><th class="end">صفوف فاشلة</th><th>آخر تشغيل</th></tr></thead><tbody>
    ${X.tests.map(([r,c,s,f,d])=>`<tr><td style="white-space:normal">${esc(r)}</td><td>${esc(c)}</td><td>${st(s,{pos:'نجح',crit:'تحذير',neg:'فشل'}[s])}</td><td class="end">${f?fmt(f):'—'}</td><td class="num">${ltr(d)}</td></tr>`).join('')}</tbody></table></div></div>`;}
function tabDesc(){const X=D.table;
  return `<div class="grid2"><div class="section"><div class="sec-h"><h2 class="sec-title">الوصف</h2><button class="b b-trans">تعديل</button></div><p class="prose">${esc(X.desc)}</p></div>
  <div class="section"><div class="sec-h"><h2 class="sec-title">الحوكمة</h2></div><dl class="kv"><dt>المالك</dt><dd>${esc(X.owner)}</dd><dt>أمين البيانات</dt><dd>${esc(X.steward)}</dd>
    <dt>مصطلحات المسرد</dt><dd style="display:flex;gap:6px;flex-wrap:wrap">${X.terms.map(t=>`<span class="gtag info">${esc(t)}</span>`).join('')}</dd>
    <dt>الوسوم</dt><dd style="display:flex;gap:6px;flex-wrap:wrap">${X.tags.map(t=>`<span class="gtag neutral">${t}</span>`).join('')}</dd></dl></div></div>
  <div class="section"><div class="sec-h"><h2 class="sec-title">الأعمدة <span class="sub num">(${X.columns.length})</span></h2></div>
    <div class="twrap"><table><thead><tr><th>العمود</th><th>النوع</th><th>الوصف</th><th>إلزامي</th></tr></thead><tbody>
    ${X.columns.map(c=>`<tr><td class="ttl">${c[0]}</td><td><span class="chip">${c[1]}</span></td><td>${esc(c[2])}</td><td>${c[3]?st('info','إلزامي'):'—'}</td></tr>`).join('')}</tbody></table></div></div>`;}
function tabLineage(){const L=D.table.lineage;
  return `<div class="section"><div class="sec-h"><h2 class="sec-title">الـ Lineage</h2><span class="sub">من المصدر إلى السجل الذهبي والتقارير</span></div>
  <div class="lin"><div class="lin-cols" id="lin">${L.map((col,ci)=>`<div class="lin-col"><div class="lin-h">${col.h}</div>${col.nodes.map((n,ni)=>`<div class="node ${n.current?'current':''} ${n.st||''}" data-n="${ci}-${ni}"><div class="nh">${svg(n.i,14)}<span>${esc(n.t)}</span>${n.st?ICON[n.st].replace('<svg','<svg style="color:'+QCOL[n.st]+';margin-inline-start:auto"'):''}</div><div class="nb">${n.kv.map(([k,v])=>`<span>${k}</span><b>${esc(v)}</b>`).join('')}</div></div>`).join('')}</div>`).join('')}
  <svg class="edges" id="edges" aria-hidden="true"></svg></div></div></div>`;}
function drawEdges(){const box=document.getElementById('lin');if(!box)return;const r0=box.getBoundingClientRect();const sv=document.getElementById('edges');let h='<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#788FA6"/></marker></defs>';
  D.table.edges.forEach(([c1,n1,c2,n2])=>{const a=box.querySelector(`[data-n="${c1}-${n1}"]`).getBoundingClientRect(),b=box.querySelector(`[data-n="${c2}-${n2}"]`).getBoundingClientRect();
    const x1=a.left-r0.left,y1=a.top+a.height/2-r0.top,x2=b.right-r0.left,y2=b.top+b.height/2-r0.top; // RTL: flow right → left
    const mx=(x1+x2)/2;h+=`<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2+2} ${y2}" fill="none" stroke="#788FA6" stroke-width="1.5" marker-end="url(#ar)"/>`;});
  sv.setAttribute('width',box.scrollWidth);sv.setAttribute('height',box.scrollHeight);sv.innerHTML=h;}

/* ───────────── Render + events ───────────── */
function render(){
  const last=path[path.length-1];
  app.innerHTML=!last?viewDomains():last.k==='domain'?viewDomain(last.id):last.k==='repo'?viewRepo(last.id):last.k==='source'?viewSource(last.id):viewTable(path[2].id,last.schema,last.id);
  if(last&&last.k==='table'&&tab==='lineage')requestAnimationFrame(drawEdges);
  const sq=document.getElementById('srcq');if(sq)sq.oninput=()=>{const pos=sq.selectionStart;srcQ=sq.value;render();const n=document.getElementById('srcq');n.focus();n.setSelectionRange(pos,pos);};
  const df=document.getElementById('domFilter');if(df)df.onsubmit=e=>{e.preventDefault();domQ=document.getElementById('fq').value.trim();domOwner=document.getElementById('fo').value;render();};
}
function activate(el){
  const g=el.dataset.go;
  if(g){const [k,a,b]=g.split(':');
    if(k==='domain')go([{k,id:a}]);
    else if(k==='repo')go([...path,{k,id:a}]);
    else if(k==='source'){srcQ='';closedSchemas.clear();go([...path,{k,id:a}]);}
    else if(k==='table')go([...path,{k,schema:a,id:b}]);return;}
  if(el.dataset.crumb!=null){go(path.slice(0,+el.dataset.crumb));return;}
  if(el.dataset.schema){const k=el.dataset.schema;closedSchemas.has(k)?closedSchemas.delete(k):closedSchemas.add(k);render();app.querySelector(`[data-schema="${k}"]`)?.focus();return;}
  if(el.dataset.tab){tab=el.dataset.tab;render();document.getElementById('tab-'+tab).focus();return;}
  const act=el.dataset.act;
  if(act==='collapse'){headerCollapsed=!headerCollapsed;render();app.querySelector('[data-act="collapse"]').focus();}
  if(act==='expandAll'){closedSchemas.clear();render();}
  if(act==='collapseAll'){Object.keys(D.sources[path[path.length-1].id].schemas).forEach(k=>closedSchemas.add(k));render();}
}
app.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-crumb],[data-schema],[data-tab],[data-act]');if(el)activate(el);});
app.addEventListener('keydown',e=>{
  const el=e.target.closest('[data-go],[data-schema]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activate(el);return;}
  const t=e.target.closest('[role="tab"]');if(t&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const list=[...app.querySelectorAll('[role="tab"]')];const i=list.indexOf(t);const d=e.key==='ArrowLeft'?1:-1;/* RTL */
    const n=list[(i+d+list.length)%list.length];tab=n.dataset.tab;render();document.getElementById('tab-'+tab).focus();}});
window.addEventListener('resize',()=>{if(tab==='lineage')drawEdges();});
render();
})();
</script>
