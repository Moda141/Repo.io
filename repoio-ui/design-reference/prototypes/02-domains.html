<meta charset="utf-8">
<title>Repo.io Domains</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: SAP Fiori Horizon (light, Compact). List Report for Domains, Object Pages with breadcrumb for each drill-down level, tabbed Object Page for a table. */
:root{
  color-scheme:light;
  --page:#F5F6F7; --card:#FFFFFF; --line:#E5E5E5; --line2:#D9D9D9; --pop-bd:#A8B3BD;
  --fg:#131E29; --fg2:#556B82; --fg3:#8396A8; --icon:#758CA4;
  --brand:#0064D9; --brand-strong:#0070F2; --hover:#EAECEE; --active:#DEE2E5; --sel:#EBF8FF; --focus:#0032A5;
  --pos:#256F3A; --pos-el:#30914C; --pos-bg:#F5FAE5;
  --crit:#B44F00; --crit-el:#E76500; --crit-bg:#FFF8D6;
  --neg:#AA0808; --neg-el:#F53232; --neg-bg:#FFEAF4;
  --info:#0064D9; --info-el:#0070F2; --info-bg:#E8F3FF;
  --neutral:#556B82; --neutral-el:#788FA6; --neutral-bg:#EFF1F2;
  --group:#EFF1F2; --field-bd:#556B81;
  --shadow:0 0 .125rem 0 rgba(34,53,72,.15),0 .125rem .5rem 0 rgba(34,53,72,.15);
  --font:"IBM Plex Sans Arabic","72","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#fff}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums}

/* Shell bar */
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#fff;height:52px;display:flex;align-items:center;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.ibtn{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn:hover{background:var(--hover)}
.logo{display:flex;align-items:center;padding:4px;border-radius:8px;flex:none}
.logo img{height:32px;width:auto;display:block}
.sep{width:1px;height:24px;background:var(--line);margin-inline:8px}
.app-title{font-weight:700;font-size:15px;white-space:nowrap}
.grow{flex:1}
.search{display:flex;align-items:center;gap:8px;width:min(400px,32vw);height:36px;padding-inline:14px 10px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px var(--pop-bd);color:var(--fg2)}
.search input{flex:1;border:0;background:transparent;font-size:14px;color:var(--fg);min-width:0;outline:none}
.search input::placeholder{color:var(--fg3);font-style:italic}
.avatar{width:32px;height:32px;border-radius:50%;background:#7858FF;color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;margin-inline-start:4px}

/* Page header (List Report / Object Page) */
.ph{background:#fff;border-bottom:1px solid var(--line);position:relative}
.ph-in{max-width:1440px;margin-inline:auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;color:var(--fg);min-height:20px}
.crumbs button{border:0;background:none;padding:0;color:var(--brand);font:inherit;cursor:pointer}
.crumbs button:hover{text-decoration:underline}
.crumbs .slash{color:var(--fg2)}
.oh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:6px;flex-wrap:wrap}
.oh-title{font-size:20px;font-weight:700;margin:0;text-wrap:balance}
.oh-sub{font-size:13px;color:var(--fg2);margin-top:2px}
.oh-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.oh-body{display:flex;gap:16px 32px;align-items:flex-start;flex-wrap:wrap;margin-top:14px;padding-bottom:18px}
.oh-img{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.oh-attrs{display:grid;grid-template-columns:auto auto;gap:3px 10px;font-size:13px;align-content:start}
.oh-attrs dt{color:var(--fg2);margin:0}
.oh-attrs dd{margin:0}
.facet .fl{font-size:13px;color:var(--fg2)}
.facet .fv{font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.handle{position:absolute;bottom:-13px;inset-inline-start:50%;transform:translateX(50%);display:flex;gap:6px;z-index:2}
.handle button{width:28px;height:24px;border-radius:8px;background:#fff;border:1px solid var(--pop-bd);color:var(--brand);display:grid;place-items:center;cursor:pointer}
.ph.collapsed .oh-body,.ph.collapsed .fbar{display:none}
.ph.collapsed .handle svg.ch{transform:rotate(180deg)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:-4px}
.tab{border:0;background:none;height:44px;padding-inline:12px;font:inherit;font-weight:600;color:var(--fg);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab:hover{color:var(--brand)}
.variant{display:inline-flex;align-items:center;gap:6px;font-size:20px;font-weight:700;color:var(--brand);border:0;background:none;padding:0;cursor:pointer}
.vsub{font-size:13px;color:var(--fg2);margin-top:4px}
.fbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 16px;align-items:end;margin-top:12px;padding-bottom:18px}
.ff{display:flex;flex-direction:column;gap:4px;min-width:0}
.ff label{font-size:13px;color:var(--fg2)}
.ff input,.ff select{height:26px;border:1px solid var(--field-bd);border-radius:4px;background:#fff;color:var(--fg);font-size:13px;padding-inline:8px;min-width:0}
.ff input::placeholder{color:var(--fg2);font-style:italic}
.fbar-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;grid-column:-2/-1}

/* Buttons */
.b{height:26px;padding-inline:8px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.b-emph{border:0;background:var(--brand-strong);color:#fff;font-weight:600}
.b-emph:hover{background:var(--brand)}
.b-std{border:1px solid #BCC3CA;background:#fff;color:var(--brand)}
.b-std:hover{background:var(--hover)}
.b-trans{border:0;background:none;color:var(--brand);font-weight:600}
.b-trans:hover{background:var(--hover)}

/* Content */
main{max-width:1440px;margin-inline:auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.section{background:#fff;border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;flex-wrap:wrap}
.sec-title{font-size:16px;font-weight:700;margin:0}
.sec-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tsearch{display:flex;align-items:center;gap:6px;height:26px;border:1px solid var(--field-bd);border-radius:4px;padding-inline:8px;background:#fff;min-width:0;width:240px;max-width:100%}
.tsearch input{border:0;outline:0;font-size:13px;flex:1;min-width:0;background:none;color:var(--fg)}
.tsearch input::placeholder{color:var(--fg2);font-style:italic}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:start;font-weight:600;padding:0 12px;height:32px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
td{padding:0 12px;height:32px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th.end,td.end{text-align:end}
tbody tr.nav{cursor:pointer}
tbody tr.nav:hover{background:var(--hover)}
tbody tr.nav:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
td.go{width:28px;color:var(--icon)}
td.go svg{transform:scaleX(-1)}
tr.grp td{background:var(--group);font-weight:700;border-bottom:1px solid #A8B3BD;cursor:pointer}
tr.grp td .gchev{display:inline-block;transition:transform .15s;margin-inline-end:6px;color:var(--fg)}
tr.grp[aria-expanded="false"] .gchev{transform:rotate(90deg)}
.cell-name{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ttl{font-weight:600}
.sub{color:var(--fg2);font-size:12px}
.null{color:var(--neg);font-style:italic}
.empty{padding:24px 16px;text-align:center;color:var(--fg2)}

/* Status */
.st{display:inline-flex;align-items:center;gap:4px;font-size:13px}
.st.pos{color:var(--pos)} .st.crit{color:var(--crit)} .st.neg{color:var(--neg)} .st.info{color:var(--info)} .st.neutral{color:var(--neutral)}
.st.pos svg{color:var(--pos-el)} .st.crit svg{color:var(--crit-el)} .st.neg svg{color:var(--neg-el)} .st.info svg{color:var(--info-el)}
.score{display:inline-flex;align-items:center;gap:8px;min-width:120px}
.score .trk{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;box-shadow:inset 0 0 0 1px #A8B3BD;min-width:48px}
.score .fil{display:block;height:100%}
.chip{display:inline-flex;align-items:center;height:22px;padding-inline:8px;border-radius:11px;background:var(--neutral-bg);font-size:12px;color:var(--fg)}
.gtag{display:inline-flex;align-items:center;gap:6px;height:24px;padding-inline:0 8px;border-radius:8px;font-size:12px;overflow:hidden}
.gtag::before{content:"";width:6px;align-self:stretch}
.gtag.info{background:#E1F4FF}.gtag.info::before{background:var(--info-el)}
.gtag.neutral{background:var(--neutral-bg)}.gtag.neutral::before{background:var(--neutral-el)}

/* Table object page — tab panels */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:8px 16px;padding:4px 16px 16px;font-size:13px}
.kv dt{color:var(--fg2);margin:0} .kv dd{margin:0}
.prose{padding:0 16px 16px;line-height:1.7;max-width:75ch;margin:0}
.dq-top{display:flex;gap:24px;align-items:center;padding:4px 16px 16px;flex-wrap:wrap}
.dq-score{font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.dq-dims{display:grid;gap:10px;flex:1;min-width:260px}
.dim{display:grid;grid-template-columns:140px 1fr 56px 52px;gap:10px;align-items:center;font-size:13px}
.dim .w{color:var(--fg2);font-size:12px;text-align:end}
.strip{display:flex;gap:8px;align-items:flex-start;margin:0 16px 16px;padding:8px 12px;border-radius:8px;font-size:13px;border:1px solid}
.strip.warn{background:var(--crit-bg);border-color:#FFC847}
.strip.info{background:var(--info-bg);border-color:#89D1FF}

/* Lineage (network-graph.svg — column layout) */
.lin{padding:8px 16px 20px;overflow-x:auto}
.lin-cols{display:grid;grid-auto-flow:column;grid-auto-columns:200px;gap:48px;position:relative;min-width:max-content;padding:8px 4px}
.lin-col{display:flex;flex-direction:column;gap:16px;justify-content:center}
.lin-h{font-size:12px;color:var(--fg2);text-align:center;margin-bottom:-6px}
.node{border:1px solid #A8B3BD;border-radius:8px;background:#fff;font-size:12px;position:relative;z-index:1}
.node .nh{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.node .nh svg{color:var(--icon);flex:none}
.node .nb{padding:6px 8px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;color:var(--fg2)}
.node .nb b{color:var(--fg);font-weight:500;text-align:end}
.node.current{border:2px solid var(--brand-strong)}
.node.pos{border-color:var(--pos-el)} .node.crit{border-color:var(--crit-el)}
.lin svg.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}

/* Responsive Table (responsive-table) */
.rt-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.rt-bar .rt-title{font-size:15px;font-weight:700;margin:0;margin-inline-end:auto}
.rt-ic{width:26px;height:26px;border:0;border-radius:8px;background:none;color:var(--brand);display:grid;place-items:center;cursor:pointer}
.rt-ic:hover{background:var(--hover)}
.rt-sep{width:1px;height:18px;background:var(--line2)}
.b:disabled{opacity:.4;cursor:default;background:none}
table.rt td{height:auto;padding-block:8px;vertical-align:top}
table.rt th{height:36px}
table.rt td.chk,table.rt th.chk{width:36px;padding-inline:12px 0}
table.rt tr{border-inline-start:0}
table.rt tbody tr{cursor:pointer;box-shadow:none}
table.rt tbody tr:hover td{background:var(--hover)}
table.rt tbody tr.sel td{background:var(--sel)}
table.rt tbody tr.sel td:first-child{box-shadow:inset -4px 0 0 var(--brand-strong)}
.cb{width:16px;height:16px;margin:2px 0 0;accent-color:var(--brand-strong);cursor:pointer}
.oid .n{font-weight:700;color:var(--brand)}
.oid .d{font-size:12px;color:var(--fg2);margin-top:2px}
.popin{margin-top:8px;display:grid;gap:6px;font-size:12px}
.popin .pl{color:var(--fg2)}
.rowact{display:flex;gap:2px;justify-content:flex-end;align-items:center;white-space:nowrap}
.rowact .go{color:var(--icon);display:grid;place-items:center;width:22px}
.rowact .go svg{transform:scaleX(-1)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);z-index:95;background:#1D2D3E;color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast button{border:0;background:none;color:#89D1FF;font:inherit;font-weight:600;cursor:pointer}

/* Spaces page (SAP Datasphere Spaces) */
.sp-sum{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 16px;background:#fff;border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px}
.sp-count{display:flex;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap}
.sp-count b{font-size:18px;font-variant-numeric:tabular-nums}
.sp-count .k{display:inline-flex;align-items:center;gap:4px;font-size:16px;font-variant-numeric:tabular-nums}
.sp-cap{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:12px;flex:1;min-width:280px}
.cap .cl{font-size:12px;color:var(--fg2);margin-bottom:3px}
.capbar{position:relative;height:14px;border-radius:7px;background:#EFF1F2;box-shadow:inset 0 0 0 1px #A8B3BD;overflow:hidden}
.capbar i{display:block;height:100%;background:#354A5E}
.capbar i{position:absolute;inset-block:0;inset-inline-start:0}
.capbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#131E29;font-variant-numeric:tabular-nums;white-space:nowrap}
.capbar span.on{color:#fff;background:#354A5E}
.sp-charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;margin-bottom:16px}
.donut-wrap{display:flex;align-items:center;gap:20px;padding:4px 16px 16px;flex-wrap:wrap}
.legend{display:grid;gap:8px;font-size:13px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hbars{padding:4px 16px 16px;display:grid;gap:10px}
.hb{display:grid;grid-template-columns:140px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.hb .tr{position:relative;height:16px;background:#EFF1F2;border-radius:3px}
.hb .tr i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:3px}
.hb .tr b{position:absolute;top:-4px;bottom:-4px;width:2px;background:#256F3A}
.sp-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sp-tools .grow{flex:1}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.space{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;cursor:pointer;min-width:0;transition:box-shadow .15s}
.space:hover{box-shadow:var(--shadow)}
.space.sel{border-color:var(--brand-strong);box-shadow:0 0 0 1px var(--brand-strong)}
.space:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.space .h{display:flex;gap:8px;align-items:flex-start;padding:12px 12px 4px}
.space .h .t{flex:1;min-width:0}
.space .code{font-weight:700;font-size:14px;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.space .nm{font-size:12px;color:var(--fg2);margin-top:2px}
.space .bd{padding:6px 12px;display:grid;gap:8px;font-size:12px}
.space .bd .cl{color:var(--fg2);margin-bottom:3px}
.space .ft{display:flex;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--line);margin-top:auto;font-size:12px;color:var(--fg2)}
.space .ft span{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.space .ft .b{margin-inline-start:auto}
.ltag{display:inline-flex;align-items:center;height:22px;padding-inline:8px;border:1px solid #A8B3BD;border-radius:4px;background:#F5F6F7;font-size:12px;width:max-content}
.sp-list .space{flex-direction:row;align-items:center}

/* Multi Instance (instance tabs) */
.inst{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:stretch;gap:2px;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.itab{display:flex;align-items:center;gap:8px;height:40px;padding-inline:12px 6px;border:0;border-bottom:3px solid transparent;background:none;color:var(--fg);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.itab:hover{background:var(--hover)}
.itab[aria-selected="true"]{border-bottom-color:var(--brand-strong);font-weight:700}
.itab svg{color:var(--icon)}
.itab .x{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--fg2)}
.itab .x:hover{background:var(--active);color:var(--fg)}
.iadd{position:relative;display:flex;align-items:center}
.iadd>button{width:32px;height:32px;margin-block:4px;border:0;border-radius:8px;background:none;color:var(--brand);cursor:pointer;display:grid;place-items:center}
.iadd>button:hover{background:var(--hover)}
.imenu{position:fixed;z-index:80;min-width:220px;background:#fff;border:1px solid var(--pop-bd);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:4px}
.imenu button{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding-inline:8px;border:0;border-radius:6px;background:none;color:var(--fg);font:inherit;font-size:13px;cursor:pointer;text-align:start}
.imenu button:hover{background:var(--hover)}
.imenu .none{padding:8px;color:var(--fg2);font-size:13px}
.gi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 32px;padding:4px 16px 16px}
.gi h3{font-size:14px;margin:4px 0 6px;grid-column:span 1}
.gi .grp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;align-content:start}
.gi .grp .ttl3{grid-column:1/-1;font-weight:700;font-size:14px;margin-top:4px}
.gi .f .fl{font-size:12px;color:var(--fg2)} .gi .f .fv{font-size:13px;margin-top:2px}
.ill{display:flex;flex-direction:column;align-items:center;gap:8px;padding:56px 16px;text-align:center;color:var(--fg2)}
.ill h3{margin:0;color:var(--fg);font-size:18px}
@media (max-width:900px){.sp-charts{grid-template-columns:1fr}.sp-cap{grid-template-columns:1fr}.gi,.gi .grp{grid-template-columns:1fr}}

/* ===== Analytical List Page (analytical-list-page.png) ===== */
.alp-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.alp-top .grow{flex:1}
.vchip{display:inline-flex;align-items:center;gap:6px;height:22px;padding-inline:8px 4px;border-radius:4px;background:var(--neg-bg);border:1px solid #FFC2DE;color:var(--neg);font-size:12px;font-weight:600}
.vchip.info{background:#E8F3FF;border-color:#89D1FF;color:var(--brand)}
.vchip button{width:18px;height:18px;border:0;border-radius:4px;background:none;color:inherit;cursor:pointer;display:grid;place-items:center;padding:0}
.vchip button:hover{background:rgba(0,0,0,.06)}
.vfbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:14px;padding-bottom:22px}
.vf{min-width:0}
.vf-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-bottom:8px}
.vf-h .u{font-weight:400;color:var(--fg2)}
.vf-h .ic{margin-inline-start:auto;color:var(--brand)}
.vf svg{display:block;width:100%;height:auto}

.chart-card .cc-sub{font-size:12px;color:var(--fg2);padding:0 16px}

/* ===== Spaces (spaces-page.png) — compact, exact ===== */
.sx-tools{display:flex;justify-content:flex-end;align-items:center;gap:2px;flex-wrap:wrap;margin-bottom:8px}
.sx-tools .b{font-weight:400}
.sx-tools .vsep{width:1px;height:18px;background:var(--line2);margin-inline:6px}
.sx-sum{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.sx-cnt{display:flex;align-items:center;gap:10px;font-size:14px;padding-bottom:1px}
.sx-cnt b{font-size:16px;font-weight:700}
.sx-cnt .k{display:inline-flex;align-items:center;gap:3px;font-size:15px;font-variant-numeric:tabular-nums}
.sx-cnt .vsep{width:1px;height:18px;background:var(--line2)}
.sx-cap{display:flex;gap:14px;flex:1;flex-wrap:wrap}
.sx-cap .cap{flex:1;min-width:150px}
.sx-cap .cl{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--fg2);margin-bottom:2px}
.sx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:8px}
.sx{background:#fff;border:1px solid #D9D9D9;border-radius:6px;display:flex;flex-direction:column;cursor:pointer;min-width:0;font-size:12px}
.sx:hover{border-color:#A8B3BD;box-shadow:0 1px 4px rgba(34,53,72,.12)}
.sx.sel{border-color:var(--brand-strong);box-shadow:0 0 0 1px var(--brand-strong)}
.sx:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sx .h{display:flex;gap:8px;align-items:flex-start;padding:10px 10px 0}
.sx .h .t{flex:1;min-width:0}
.sx .code{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx .nm{color:var(--fg2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx .cbx{width:14px;height:14px;margin:2px 0 0;accent-color:var(--brand-strong)}
.sx hr{border:0;border-top:1px solid var(--line);margin:8px 0 0}
.sx .bd{padding:8px 10px;display:grid;gap:7px}

.sx .capbar{height:12px}
.sx .capbar span{font-size:9.5px}
.sx .chipx{display:inline-flex;align-items:center;height:20px;padding-inline:6px;border:1px solid #BCC3CA;border-radius:4px;background:#F5F6F7;font-size:11px;width:max-content}
.sx .ft{display:flex;align-items:center;gap:10px;padding:6px 10px 8px;margin-top:auto;color:var(--fg2)}
.sx .ft span{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.sx .ft .b{margin-inline-start:auto;height:22px;font-size:12px;padding-inline:8px}
.sx-list{grid-template-columns:1fr}
.minidonut{flex:none}

/* ===== Object Page (object-page-instance.png) ===== */
.anchors{display:flex;gap:2px;overflow-x:auto;margin-top:-6px}
.anchors .tab{height:40px;font-size:13px}
.op-sec{margin-bottom:28px;scroll-margin-top:68px}
.op-sec>h2{font-size:18px;font-weight:700;margin:0 0 10px}
.gi2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 40px;padding:14px 16px 18px}
.gi2 .grp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;align-content:start}
.gi2 .grp h3{grid-column:1/-1;font-size:14px;font-weight:700;margin:0}

/* Grid Table (SAP ui.table.Table) */
.gt-wrap{overflow:auto;max-height:460px;border-top:1px solid #D9D9D9}
table.gt{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
table.gt th,table.gt td{height:32px;padding:0 10px;border-inline-end:1px solid #E5E5E5;border-bottom:1px solid #E5E5E5;white-space:nowrap;background:#fff}

table.gt th{height:40px}

.gt-foot{display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid #D9D9D9;font-size:12px;color:var(--fg2);flex-wrap:wrap}
.gt-foot .grow{flex:1}

.avg{display:flex;align-items:center}
.avg .av{width:24px;height:24px;border:2px solid #fff;margin-inline-start:-6px;font-size:10px}
.avg .av:first-child{margin-inline-start:0}
.avg .more{margin-inline-start:6px;font-size:12px;color:var(--fg2)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tags .gtag{height:20px;font-size:11px}

/* Source icons */
.srcic{display:inline-grid;place-items:center;border-radius:6px;color:#fff;flex:none;font-weight:700;letter-spacing:-.02em}

/* Segmented button (segmented-button.svg) */
.seg{display:inline-flex;border:1px solid #BCC3CA;border-radius:8px;overflow:hidden;background:#fff}
.seg button{height:26px;padding-inline:10px;border:0;background:none;color:var(--brand);font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button+button{border-inline-start:1px solid #BCC3CA}
.seg button[aria-pressed="true"]{background:var(--sel);box-shadow:inset 0 0 0 1px var(--brand);font-weight:600}
.seg button:hover:not([aria-pressed="true"]){background:var(--hover)}
.seg .cnt{font-variant-numeric:tabular-nums;color:var(--fg2);font-weight:400}

/* Object cards (cards.svg — Object Card) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ocard{background:#fff;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s;min-width:0;text-align:start;border:0;padding:0;font:inherit;color:inherit}
.ocard:hover{box-shadow:0 0 0 1px var(--brand-strong),var(--shadow)}
.oc-h{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 8px}

.oc-t{flex:1;min-width:0}
.oc-title{font-weight:700;font-size:15px}
.oc-sub{font-size:12px;color:var(--fg2);margin-top:2px}
.oc-desc{padding:0 16px;color:var(--fg2);font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.oc-kpi{display:flex;align-items:flex-end;gap:12px;padding:12px 16px 4px}
.oc-kpi .big{font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.oc-kpi .lbl{font-size:12px;color:var(--fg2)}
.oc-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px;margin-top:8px;border-top:1px solid var(--line)}
.oc-facts div{min-width:0}
.oc-facts .fl{font-size:12px;color:var(--fg2)}
.oc-facts .fv{font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
.oc-foot{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;margin-top:auto}
.oc-foot .more{margin-inline-start:auto;color:var(--brand);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.oc-foot .more svg{transform:scaleX(-1)}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.mbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1;min-width:60px;margin-bottom:6px;position:relative}
.mbar i{display:block;height:100%}
.mbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#131E29}

/* List with object identifier + micro process flow (micro-process-flow.svg) */
.olist{list-style:none;margin:0;padding:0}
.oli{display:grid;grid-template-columns:minmax(180px,1.4fr) auto minmax(220px,1.4fr) minmax(130px,.9fr) 110px 24px;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.oli:hover{background:var(--hover)}
.oli:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.oli .id .n{font-weight:700;color:var(--brand)}
.oli .id .d{font-size:12px;color:var(--fg2);margin-top:2px}
.oli .go{color:var(--icon)} .oli .go svg{transform:scaleX(-1)}
.oli .gold .fl{font-size:12px;color:var(--fg2)} .oli .gold .fv{font-variant-numeric:tabular-nums}
.mpf{display:flex;align-items:center;gap:0}

.mpf .c{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#fff}

.gtag.pos{background:var(--pos-bg)}.gtag.pos::before{background:var(--pos-el)}
.gtag.crit{background:var(--crit-bg)}.gtag.crit::before{background:var(--crit-el)}

/* Quality screen */
.dq-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);gap:16px}
.kpi-card{padding:4px 16px 16px}
.kpi-row{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.kpi-big{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.kpi-side{display:grid;grid-template-columns:auto auto auto;column-gap:18px;font-size:13px;text-align:center}

.dim-t{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.dim-t .nm{font-weight:600;font-size:13px}
.dim-t .ct{font-size:12px;color:var(--fg2)}
.ring{width:76px;height:76px}
.formula{margin:0 16px 16px;padding:10px 12px;border-radius:8px;background:var(--neutral-bg);font-size:12px;color:var(--fg2);line-height:1.7}

.cbars{padding:4px 16px 16px;display:grid;gap:8px}
.cbar{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;font-size:13px}

.tests .rule{white-space:normal;min-width:240px}
.pct{font-size:12px;color:var(--fg2)}

let domRTQ='', vfDomain=null, vfStatus=null;
const STATUS_L={Deployed:'منشور',Draft:'مسودة',Archived:'مؤرشف'}, STATUS_C={Deployed:'#30914C',Draft:'#0070F2',Archived:'#788FA6'};
function vfBars(){ // golden records by domain (horizontal bars) — clicking filters
  const data=D.domains.map(d=>({id:d.id,l:d.name,v:domainStats(d).golden}));const max=Math.max(...data.map(x=>x.v));
  const W=300,rowH=24,H=data.length*rowH+8,lab=104,valW=52;
  return `<svg viewBox="0 0 ${W} ${H}" style="direction:ltr" role="group" aria-label="السجلات الذهبية حسب الدومين">${data.map((x,i)=>{const y=4+i*rowH,w=Math.max(2,(W-lab-valW)*x.v/max),on=!vfDomain||vfDomain===x.id;
    return `<g class="hit" tabindex="0" role="button" aria-pressed="${vfDomain===x.id}" data-vfd="${x.id}"><rect x="0" y="${y}" width="${W}" height="${rowH-2}" fill="${vfDomain===x.id?'#EBF8FF':'transparent'}"/>
      <text x="${W-4}" y="${y+15}" font-size="10.5" text-anchor="start" fill="#131E29" direction="rtl">${esc(x.l)}</text>
      <rect x="${W-lab-w}" y="${y+4}" width="${w}" height="${rowH-10}" fill="${on?'#0070F2':'#B5D7FF'}"/>
      <text x="${W-lab-w-4}" y="${y+15}" font-size="10" text-anchor="end" fill="#131E29">${x.v>=1000?(x.v/1000).toFixed(1)+'K':x.v}</text></g>`;}).join('')}</svg>`;}
function vfLine(){ const W=300,H=110,L=22,R=26,T=12,B=20,vals=D.trend.map(t=>t[1]),min=80,max=90;
  const x=i=>W-R-(i*(W-R-L)/(vals.length-1)),y=v=>T+(max-v)*(H-T-B)/(max-min);
  let g='';[80,85,90].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#E5E5E5"/><text x="${W-R+4}" y="${y(v)+3}" font-size="9" fill="#556B82">${v}</text>`);
  g+=`<polyline points="${vals.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="#0070F2" stroke-width="1.6"/>`;
  vals.forEach((v,i)=>{g+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="#fff" stroke="#0070F2" stroke-width="1.4"/>`;if(i%2===0||i===vals.length-1)g+=`<text x="${x(i)}" y="${y(v)-6}" font-size="9" text-anchor="middle" fill="#131E29">${v}</text>`;});
  D.trend.forEach((t,i)=>{if(i%2===1)g+=`<text x="${x(i)}" y="${H-5}" font-size="9" text-anchor="middle" fill="#556B82">${t[0]}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" style="direction:ltr" role="img" aria-label="متوسط الجودة آخر 8 أيام">${g}</svg>`;}
function vfDonut(){ const c={Deployed:0,Draft:0,Archived:0};Object.values(D.repos).forEach(R=>c[R.status]++);const tot=Object.values(c).reduce((a,b)=>a+b,0);
  const Rr=34,C=2*Math.PI*Rr;let off=0,seg='',leg='';
  Object.keys(c).forEach(k=>{const len=C*c[k]/tot,on=!vfStatus||vfStatus===k;
    seg+=`<circle class="hit" tabindex="0" role="button" aria-label="${STATUS_L[k]} ${c[k]}" aria-pressed="${vfStatus===k}" data-vfs="${k}" cx="${250}" cy="52" r="${Rr}" fill="none" stroke="${STATUS_C[k]}" stroke-opacity="${on?1:.3}" stroke-width="${vfStatus===k?18:14}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 250 52)"/>`;off+=len;
    leg+=`<g class="hit" data-vfs="${k}"><rect x="${150}" y="${18+Object.keys(c).indexOf(k)*24}" width="10" height="10" fill="${STATUS_C[k]}" opacity="${on?1:.3}"/><text x="${144}" y="${27+Object.keys(c).indexOf(k)*24}" font-size="11" text-anchor="start" direction="rtl" fill="#131E29">${STATUS_L[k]} · ${Math.round(c[k]/tot*100)}%</text></g>`;});
  return `<svg viewBox="0 0 300 104" style="direction:ltr" role="group" aria-label="المستودعات حسب الحالة">${seg}${leg}</svg>`;}
function colChart(){ const repos=Object.entries(D.repos).filter(([id])=>!vfDomain||D.domains.find(d=>d.id===vfDomain)?.repos.includes(id)).filter(([,R])=>!vfStatus||R.status===vfStatus);
  const W=1000,H=230,L=40,RP=50,T=16,B=40;const max=Math.max(1,...repos.map(([,R])=>R.golden));const nice=max>500000?1000000:max>50000?100000:max>5000?10000:max>500?1000:100;const top=Math.ceil(max/nice)*nice;
  const y=v=>T+(top-v)*(H-T-B)/top;const slot=(W-L-RP)/Math.max(1,repos.length),bw=Math.min(56,slot*.55);
  let g='';for(let k=0;k<=4;k++){const v=top*k/4;g+=`<line x1="${L}" x2="${W-RP}" y1="${y(v)}" y2="${y(v)}" stroke="#E5E5E5"/><text x="${W-RP+6}" y="${y(v)+4}" font-size="11" fill="#556B82">${v>=1000?(v/1000)+'K':v}</text>`;}
  repos.forEach(([id,R],i)=>{const cx=W-RP-slot*(i+.5),h=H-B-y(R.golden);g+=`<rect x="${cx-bw/2}" y="${y(R.golden)}" width="${bw}" height="${Math.max(h,1)}" fill="#0070F2"><title>${esc(R.name)}: ${fmt(R.golden)}</title></rect><text x="${cx}" y="${H-B+16}" font-size="11" text-anchor="middle" fill="#131E29" direction="rtl">${esc(R.name.length>16?R.name.slice(0,15)+'…':R.name)}</text>`;
    if(R.golden)g+=`<text x="${cx}" y="${y(R.golden)-5}" font-size="10" text-anchor="middle" fill="#131E29">${fmt(R.golden)}</text>`;});
  g+=`<rect x="${W-RP-8}" y="${H-12}" width="10" height="10" fill="#0070F2"/><text x="${W-RP-14}" y="${H-3}" font-size="11" text-anchor="start" direction="rtl" fill="#131E29">السجلات الذهبية</text>`;
  return `<svg class="col" viewBox="0 0 ${W} ${H}" style="direction:ltr" role="img" aria-label="السجلات الذهبية حسب المستودع">${g}</svg>`;}
function viewDomains(){

function miniDonut(H){const parts=[['pos','#30914C'],['crit','#E76500'],['neg','#F53232'],['info','#0070F2'],['neutral','#788FA6']];const tot=parts.reduce((a,[k])=>a+H[k],0)||1;const R=11,C=2*Math.PI*R;let off=0,g='';

  <div class="gt-foot"><span>عرض ${X.sample.length} من ${fmt(951247)} صف</span><span>·</span><span>${X.columns.length} أعمدة</span><span class="grow"></span><span>${gridSel.size?`${gridSel.size} صفوف محددة`:'اضغط رقم الصف للتحديد'}</span></div></div>`;}
let testFilter='all';
function ring(v,color){const r=34,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 84 84" role="img" aria-label="${v.toFixed(1)}%"><circle cx="42" cy="42" r="${r}" fill="none" stroke="#EFF1F2" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="15" font-weight="600" fill="#131E29">${v.toFixed(0)}%</text></svg>`;}
function trendSvg(){const W=520,H=160,L=40,R=40,T=18,B=26;const vals=D.trend.map(t=>t[1]);const min=78,max=100;
  const x=i=>W-R-(i*(W-R-L)/(vals.length-1)); /* RTL: oldest on the right */
  const y=v=>T+(max-v)*(H-T-B)/(max-min);
  let g='';[80,85,90,95,100].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#E5E5E5"/><text x="${W-R+6}" y="${y(v)+4}" font-size="10" fill="#556B82">${v}%</text>`;});
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const area=`${x(0)},${y(min)} ${pts} ${x(vals.length-1)},${y(min)}`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(D.target)}" y2="${y(D.target)}" stroke="#256F3A" stroke-dasharray="4 3"/><text x="${L+70}" y="${y(D.target)-5}" font-size="10" direction="rtl" text-anchor="start" fill="#256F3A">الهدف <tspan direction="ltr" unicode-bidi="embed">${D.target}%</tspan></text>`;
  g+=`<polygon points="${area}" fill="#0070F2" opacity=".08"/><polyline points="${pts}" fill="none" stroke="#0070F2" stroke-width="2"/>`;
  vals.forEach((v,i)=>{const last=i===vals.length-1;g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${last?4.5:2.5}" fill="${last?'#0070F2':'#fff'}" stroke="#0070F2" stroke-width="1.5"/>`;});
  D.trend.forEach((t,i)=>{if(i%2===1||i===vals.length-1)g+=`<text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#556B82">${t[0]}</text>`;});
  g+=`<text x="${x(vals.length-1)}" y="${y(vals[vals.length-1])-9}" font-size="11" font-weight="600" text-anchor="middle" fill="#131E29">${vals[vals.length-1]}%</text>`;
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="درجة الجودة آخر 8 أيام، من ${vals[0]}% إلى ${vals[vals.length-1]}%">${g}</svg>`;}
function tabDQ(T){const X=D.table.dq;

  const counts={all:X.tests.length,neg:0,crit:0,pos:0};X.tests.forEach(t=>counts[t[2]]++);
  const tests=X.tests.filter(t=>testFilter==='all'||t[2]===testFilter);
  const cols=[...D.table.columns].sort((a,b)=>b[4]-a[4]);
  return `<div class="dq-grid">
  <div class="section"><div class="sec-h"><h2 class="sec-title">درجة الجودة</h2>${st(qs,qs==='pos'?'ضمن الهدف':'دون الهدف')}</div>
    <div class="kpi-card"><div class="kpi-row"><div class="kpi-big st ${qs}" style="font-size:44px">${ltr(total.toFixed(1)+'<small style="font-size:18px">%</small>')}</div>
      <div class="kpi-side"><span>الهدف</span><span>الانحراف</span><span>منذ أمس</span><span class="num">${D.target}%</span><span class="num st neg">${ltr((dev>0?'+':'−')+Math.abs(dev).toFixed(1))}</span><span class="num st pos">${ltr('+'+(total-prev).toFixed(1))}</span></div></div>
      <div class="sub" style="margin-top:6px">آخر فحص ${ltr(T.prof)} · آخر 8 أيام</div>${trendSvg()}</div></div>
  <div class="section"><div class="sec-h"><h2 class="sec-title">أبعاد الجودة</h2><span class="sub">الدرجة × الوزن = المساهمة</span></div>
    <div class="dims">${X.dims.map(([l,k,w,v])=>{const s=qState(v);return `<div class="dim-t"><span class="nm">${l}</span>${ring(v,QCOL[s])}<span class="gtag neutral" style="font-size:11px">الوزن ${ltr(w+'%')}</span><span class="ct">يساهم بـ <b class="num" style="color:var(--fg)">${(w*v/100).toFixed(1)}</b> من ${w} نقطة</span></div>`;}).join('')}</div>
    <p class="formula"><b>طريقة الحساب:</b> نموذج الجودة المعتمد — الدقة والمطابقة 30%، الاكتمال 25%، الصلاحية والاتساق 20%، الحداثة 15%، التفرد 10%. مجموع المساهمات = <b class="num">${total.toFixed(1)}%</b>. إذا لم تتوفر قياسات كافية لبُعد ما تظهر الدرجة "غير متاح — بيانات الجودة غير كافية" ولا تُحتسب.</p></div></div>
  <div class="strip warn">${ICON.crit.replace('<svg','<svg style="color:var(--crit-el);flex:none;margin-top:2px"')}<span><b>أكبر فرصة للتحسين: الاكتمال.</b> عمودا Email وPhone فارغان في 37.8% و28.9% من الصفوف. و4,821 سجلاً مرشحاً للدمج — افتح <a href="#" onclick="return false">مرشحو الدمج</a>.</span></div>
  <div class="dq-grid">
  <div class="section"><div class="sec-h"><h2 class="sec-title">اكتمال الأعمدة</h2><span class="sub">نسبة القيم الفارغة، الأعلى أولاً</span></div>
    <div class="cbars">${cols.map(c=>{const s=c[4]>20?'neg':c[4]>5?'crit':'pos';return `<div class="cbar"><span>${c[0]}${c[3]?' <span class="req">إلزامي</span>':''}</span><span class="tr" role="img" aria-label="${c[0]} فارغ ${c[4]}%"><i style="width:${Math.max(c[4],.6)}%;background:${QCOL[s]}"></i></span><span class="st ${s} num">${c[4].toFixed(1)}%</span></div>`;}).join('')}</div></div>
  <div class="section tests"><div class="sec-h"><h2 class="sec-title">اختبارات الجودة</h2>
    <span class="seg" role="group" aria-label="تصفية الاختبارات">${[['all','الكل',''],['neg','فشل',ICON.neg],['crit','تحذير',ICON.crit],['pos','نجح',ICON.pos]].map(([k,l,ic])=>`<button data-tf="${k}" aria-pressed="${testFilter===k}"><span class="st ${k==='all'?'':k}" style="gap:4px">${ic}${l}</span> <span class="cnt">${counts[k]}</span></button>`).join('')}</span></div>
    <div class="twrap"><table><thead><tr><th>القاعدة</th><th>العمود</th><th>النتيجة</th><th class="end">صفوف فاشلة</th><th>آخر تشغيل</th></tr></thead><tbody>
    ${tests.map(([r,c,s,f,d])=>`<tr><td class="rule">${esc(r)}</td><td><span class="chip">${esc(c)}</span></td><td>${st(s,{pos:'نجح',crit:'تحذير',neg:'فشل'}[s])}</td><td class="end">${f?`${fmt(f)} <span class="pct">(${(f/T.rows*100).toFixed(1)}%)</span>`:'—'}</td><td class="num">${ltr(d)}</td></tr>`).join('')}</tbody></table></div></div></div>`;}
function tabDesc(){const X=D.table;

function tabLineage(){const L=D.table.lineage;

  <div class="lin"><div class="lin-cols" id="lin">${L.map((col,ci)=>`<div class="lin-col"><div class="lin-h">${col.h}</div>${col.nodes.map((n,ni)=>`<div class="node ${n.current?'current':''} ${n.st||''}" data-n="${ci}-${ni}"><div class="nh">${n.src?srcIcon(n.src,16):svg(n.i,14)}<span>${esc(n.t)}</span>${n.st?ICON[n.st].replace('<svg','<svg style="color:'+QCOL[n.st]+';margin-inline-start:auto"'):''}</div><div class="nb">${n.kv.map(([k,v])=>`<span>${k}</span><b>${esc(v)}</b>`).join('')}</div></div>`).join('')}</div>`).join('')}
  <svg class="edges" id="edges" aria-hidden="true"></svg></div></div></div>`;}
function drawEdges(){const box=document.getElementById('lin');if(!box)return;const r0=box.getBoundingClientRect();const sv=document.getElementById('edges');let h='<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#788FA6"/></marker></defs>';
  D.table.edges.forEach(([c1,n1,c2,n2])=>{const a=box.querySelector(`[data-n="${c1}-${n1}"]`).getBoundingClientRect(),b=box.querySelector(`[data-n="${c2}-${n2}"]`).getBoundingClientRect();
    const x1=a.left-r0.left,y1=a.top+a.height/2-r0.top,x2=b.right-r0.left,y2=b.top+b.height/2-r0.top; // RTL: flow right → left
    const mx=(x1+x2)/2;h+=`<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2+2} ${y2}" fill="none" stroke="#788FA6" stroke-width="1.5" marker-end="url(#ar)"/>`;});
  sv.setAttribute('width',box.scrollWidth);sv.setAttribute('height',box.scrollHeight);sv.innerHTML=h;}

/* ───────────── Render + events ───────────── */
function render(){
  const last=path[path.length-1];
  app.innerHTML=!last?viewDomains():last.k==='domain'?viewDomain(last.id):last.k==='repo'?viewRepo(last.id):viewTable(last.src,last.schema,last.id);
  const rq=document.getElementById('rtq');if(rq)rq.oninput=()=>{const pos=rq.selectionStart;domRTQ=rq.value;render();const n=document.getElementById('rtq');n.focus();n.setSelectionRange(pos,pos);};
  const pq=document.getElementById('spq');if(pq)pq.oninput=()=>{const pos=pq.selectionStart;spQ=pq.value;render();const n=document.getElementById('spq');n.focus();n.setSelectionRange(pos,pos);};
  if(last&&last.k==='table'&&tab==='lineage')requestAnimationFrame(drawEdges);
  const sq=document.getElementById('srcq');if(sq)sq.oninput=()=>{const pos=sq.selectionStart;srcQ=sq.value;render();const n=document.getElementById('srcq');n.focus();n.setSelectionRange(pos,pos);};
  const df=document.getElementById('domFilter');if(df)df.onsubmit=e=>{e.preventDefault();domQ=document.getElementById('fq').value.trim();domOwner=document.getElementById('fo').value;render();};
}
function activate(el){
  const g=el.dataset.go;
  if(g){const [k,a,b,c]=g.split(':');
    if(k==='domain'){spQ='';selRepos.clear();go([{k,id:a}]);}
    else if(k==='repo'){srcTab='sec-general';selTables.clear();srcQ='';closedSchemas.clear();go([...path,{k,id:a}]);}
    else if(k==='table'){testFilter='all';go([...path,{k,src:a,schema:b,id:c}]);}return;}
  if(el.dataset.crumb!=null){const i=+el.dataset.crumb;
    // rebuild the same parts crumbs() renders, to map index → path
    const parts=[{p:[]}];path.forEach((x,n)=>{const p=path.slice(0,n+1);if(x.k==='domain')parts.push({p});if(x.k==='repo'){parts.push({p});if(n===path.length-1&&activeSrc[x.id])parts.push({p});}if(x.k==='table'){parts.push({p:path.slice(0,n),src:x.src});parts.push({p});}});
    const t=parts[i];if(t.src){const repo=t.p[t.p.length-1].id;activeSrc[repo]=t.src;if(!openSrc[repo].includes(t.src))openSrc[repo].push(t.src);}
    go(t.p);return;}
  if(el.dataset.close){const repo=path[path.length-1].id,x=el.dataset.close;openSrc[repo]=openSrc[repo].filter(y=>y!==x);if(activeSrc[repo]===x)activeSrc[repo]=openSrc[repo][0];render();(app.querySelector('.itab[aria-selected="true"]')||app.querySelector('[data-act="addInst"]')).focus();return;}
  if(el.dataset.inst){activeSrc[path[path.length-1].id]=el.dataset.inst;srcQ='';render();app.querySelector('.itab[aria-selected="true"]').focus();return;}
  if(el.dataset.grow!=null){const r=+el.dataset.grow;gridSel.has(r)?gridSel.delete(r):gridSel.add(r);render();return;}
  if(el.dataset.anchor){srcTab=el.dataset.anchor;render();document.getElementById(srcTab)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});app.querySelector(`[data-anchor="${srcTab}"]`).focus({preventScroll:true});return;}
  if(el.dataset.vfd){vfDomain=vfDomain===el.dataset.vfd?null:el.dataset.vfd;render();app.querySelector(`[data-vfd="${el.dataset.vfd}"]`)?.focus();return;}
  if(el.dataset.vfs){vfStatus=vfStatus===el.dataset.vfs?null:el.dataset.vfs;render();app.querySelector(`circle[data-vfs="${el.dataset.vfs}"]`)?.focus();return;}
  if(el.dataset.vfx){if(el.dataset.vfx==='d')vfDomain=null;else vfStatus=null;render();return;}
  if(el.dataset.spv){spView=el.dataset.spv;render();app.querySelector(`[data-spv="${spView}"]`).focus();return;}
  if(el.dataset.del){const id=el.dataset.del,i=D.domains.findIndex(d=>d.id===id),item=D.domains[i];D.domains.splice(i,1);selDomains.delete(id);render();
    showToast(`تم حذف "${item.name}" (توضيحي)`,()=>{D.domains.splice(i,0,item);render();});return;}
  if(el.dataset.inopen){const repo=path[path.length-1].id;openSrc[repo].push(el.dataset.inopen);activeSrc[repo]=el.dataset.inopen;closeImenu();render();return;}
  if(el.dataset.schema){const k=el.dataset.schema;closedSchemas.has(k)?closedSchemas.delete(k):closedSchemas.add(k);render();app.querySelector(`[data-schema="${k}"]`)?.focus();return;}
  if(el.dataset.tab){tab=el.dataset.tab;render();document.getElementById('tab-'+tab).focus();return;}
  if(el.dataset.view){domView=el.dataset.view;render();app.querySelector(`[data-view="${domView}"]`).focus();return;}
  if(el.dataset.rf){repoFilter=el.dataset.rf;render();app.querySelector(`[data-rf="${repoFilter}"]`).focus();return;}
  if(el.dataset.tf){testFilter=el.dataset.tf;render();app.querySelector(`[data-tf="${testFilter}"]`).focus();return;}
  const act=el.dataset.act;
  if(act==='collapse'){headerCollapsed=!headerCollapsed;render();app.querySelector('[data-act="collapse"]').focus();}
  if(act==='expandAll'){closedSchemas.clear();render();}
  if(act==='collapseAll'){Object.keys(D.sources[activeSrc[path[path.length-1].id]].schemas).forEach(k=>closedSchemas.add(k));render();}
  if(act==='reopenAll'){const repo=path[path.length-1].id;openSrc[repo]=[...D.repos[repo].sources];activeSrc[repo]=openSrc[repo][0];render();}
  if(act==='delSel'){const ids=[...selDomains];const removed=ids.map(id=>[D.domains.findIndex(d=>d.id===id),D.domains.find(d=>d.id===id)]).sort((a,b)=>a[0]-b[0]);
    D.domains=D.domains.filter(d=>!selDomains.has(d.id));selDomains.clear();render();showToast(`تم حذف ${removed.length} (توضيحي)`,()=>{removed.forEach(([i,d])=>D.domains.splice(i,0,d));render();});}
  if(act==='addInst'){openImenu(el);}
}
app.addEventListener('click',e=>{
  const cb=e.target.closest('input[type=checkbox]');
  if(cb){e.stopPropagation();if(cb.dataset.sel){cb.checked?selDomains.add(cb.dataset.sel):selDomains.delete(cb.dataset.sel);render();app.querySelector(`[data-sel="${cb.dataset.sel}"]`).focus();}
    else if(cb.dataset.selall){const vis=[...app.querySelectorAll('[data-sel]')].map(x=>x.dataset.sel);cb.checked?vis.forEach(v=>selDomains.add(v)):vis.forEach(v=>selDomains.delete(v));render();app.querySelector('[data-selall]').focus();}
    else if(cb.dataset.tsel){cb.checked?selTables.add(cb.dataset.tsel):selTables.delete(cb.dataset.tsel);render();app.querySelector(`[data-tsel="${cb.dataset.tsel}"]`).focus();}
    else if(cb.dataset.tselall){const vis=[...app.querySelectorAll('[data-tsel]')].map(x=>x.dataset.tsel);cb.checked?vis.forEach(v=>selTables.add(v)):vis.forEach(v=>selTables.delete(v));render();app.querySelector('[data-tselall]').focus();}
    else if(cb.dataset.rselall){const vis=[...app.querySelectorAll('[data-rsel]')].map(x=>x.dataset.rsel);cb.checked?vis.forEach(v=>selRepos.add(v)):vis.forEach(v=>selRepos.delete(v));render();app.querySelector('[data-rselall]').focus();}
    else if(cb.dataset.rsel){cb.checked?selRepos.add(cb.dataset.rsel):selRepos.delete(cb.dataset.rsel);render();app.querySelector(`[data-rsel="${cb.dataset.rsel}"]`).focus();}
    return;}
  const el=e.target.closest('[data-close],[data-inst],[data-grow],[data-anchor],[data-vfd],[data-vfs],[data-vfx],[data-spv],[data-del],[data-inopen],[data-view],[data-rf],[data-tf],[data-act],[data-go],[data-crumb],[data-schema],[data-tab]');if(el)activate(el);});
/* Toast with undo */
let toastT;function showToast(text,undo){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}
  t.innerHTML=`<span>${esc(text)}</span>${undo?'<button>تراجع</button>':''}`;t.hidden=false;const b=t.querySelector('button');if(b)b.onclick=()=>{undo();t.hidden=true;};clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,5000);}
/* "+" menu on the instance bar */
let imenu=null;function closeImenu(){if(imenu){imenu.remove();imenu=null;}}
function openImenu(btn){closeImenu();const repo=path[path.length-1].id;const others=Object.keys(D.sources).filter(x=>!openSrc[repo].includes(x));
  imenu=document.createElement('div');imenu.className='imenu';imenu.setAttribute('role','menu');
  imenu.innerHTML=others.length?others.map(x=>`<button role="menuitem" data-inopen="${x}">${srcIcon(x,18)}${esc(D.sources[x].name)}${D.repos[repo].sources.includes(x)?'':' <span class="sub">(مصدر آخر)</span>'}</button>`).join(''):'<div class="none">كل المصادر مفتوحة</div>';
  document.body.appendChild(imenu);const r=btn.getBoundingClientRect();imenu.style.top=(r.bottom+4)+'px';imenu.style.left=Math.max(8,Math.min(innerWidth-imenu.offsetWidth-8,r.left))+'px';
  imenu.addEventListener('click',e=>{const b=e.target.closest('[data-inopen]');if(b)activate(b);});imenu.querySelector('button')?.focus();}
document.addEventListener('click',e=>{if(imenu&&!imenu.contains(e.target)&&!e.target.closest('[data-act="addInst"]'))closeImenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeImenu();});
app.addEventListener('keydown',e=>{
  if(e.target.matches('input'))return;const el=e.target.closest('[data-close],[data-inst],[data-vfd],[data-vfs],[data-go],[data-schema]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activate(el);return;}
  const t=e.target.closest('[role="tab"]');if(t&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const list=[...app.querySelectorAll('[role="tab"]')];const i=list.indexOf(t);const d=e.key==='ArrowLeft'?1:-1;/* RTL */
    const n=list[(i+d+list.length)%list.length];tab=n.dataset.tab;render();document.getElementById('tab-'+tab).focus();}});
window.addEventListener('resize',()=>{if(tab==='lineage')drawEdges();});
render();
})();
</script>
