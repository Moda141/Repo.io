home.hero.alt=Repo.io: a data steward working on master data
home.hero.title=Repo.io: one trusted source for your master data
home.hero.text=Repo.io is Nahdet Misr's master data management platform. It brings customer, vendor, book, author, employee and outlet data together from SAP C4C, SAP ERP, SQL Server and Excel files, finds duplicates and merges them into governed golden records that serve applications, BI reports and AI agents.
home.hero.more=Learn more
home.about.title=About Repo.io
home.about.unify=Unify sources
home.about.unify.text=Connect SAP C4C, SAP ERP, SQL Server and spreadsheets, and bring their data into one governed lakehouse.
home.about.match=Match and merge
home.about.match.text=Duplicates are detected with match probabilities, and survivorship rules pick the best value for every attribute.
home.about.govern=Governed changes
home.about.govern.text=Every change goes through a change request and an approval workflow, with a full audit trail.
home.about.serve=Serve golden records
home.about.serve.text=Applications, BI and AI agents read golden records through APIs, each with the user's own permissions.
home.wc.title=Welcome to Repo.io
home.wc.text=Everything you need to manage master data in one place, from connecting a source to approving a golden record.
home.wc.start=Get started in three steps:
home.step.domain=Create a domain and its repositories
home.step.domain.hint=A domain such as Customer holds one or more repositories, each with its model.
home.step.sources=Connect your data sources
home.step.sources.hint=SAP C4C, SAP ERP, SQL Server or a file upload.
home.step.golden=Review matches and approve golden records
home.step.golden.hint=Stewards confirm duplicates; the golden record is built from the best values.
